services:
  app:
    build: .
    ports:
      - "8080:10000"
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: rsync
      DB_USERNAME: rsync
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private_files:/var/www/html/storage/app/private   # business permits
      - room_photos:/var/www/html/public/images           # uploaded photos (local driver)
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rsync
      POSTGRES_USER: rsync
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsync -d rsync"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  private_files:
  room_photos:
