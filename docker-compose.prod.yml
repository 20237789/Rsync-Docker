# Production stack for the Proxmox VM/LXC: pulls the prebuilt image from GHCR.
# Put this file and a .env (see .env.production.example) in /opt/rsync on the server.
services:
  app:
    image: ghcr.io/YOUR_GITHUB_USER/YOUR_REPO:latest   # lowercase!
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: rsync
      DB_USERNAME: rsync
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:10000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private_files:/var/www/html/storage/app/private   # business permits
      - room_photos:/var/www/html/public/images           # uploaded room photos
    labels:
      - com.centurylinklabs.watchtower.enable=true        # only the app is auto-updated
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:10000/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rsync
      POSTGRES_USER: rsync
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rsync -d rsync"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:latest   # maintained fork of containrrr/watchtower
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Only needed if the GHCR package is PRIVATE (run `docker login ghcr.io` on the server first):
      # - /root/.docker/config.json:/config.json:ro
    restart: unless-stopped

volumes:
  pgdata:
  private_files:
  room_photos:
